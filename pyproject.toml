[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biolaser-twin"
version = "0.2.0"
description = "Physics-based biophotonic cavity simulator, feature extractor, Fisher/DoE identifiability, and PIELM/NLS inversion suite."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Karol Struniawski", email = "karol_struniawski@sggw.edu.pl" },
]
requires-python = ">=3.10"
keywords = [
    "biophotonics",
    "fabry-perot",
    "microcavity-laser",
    "population-balance",
    "identifiability",
    "inverse-problems",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26.0,<2.4.0",
    "scipy>=1.11.0",
    "torch>=2.1.0",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4",
    "matplotlib>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/KStruniawski/BioLaserTwin"
Repository = "https://github.com/KStruniawski/BioLaserTwin"
Issues = "https://github.com/KStruniawski/BioLaserTwin/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["biolaser_twin*"]

[tool.setuptools.package-data]
biolaser_twin = ["simulator/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
