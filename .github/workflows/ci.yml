name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check biolaser_twin tests examples

      - name: Run smoke verification tests
        run: pytest tests/test_verification.py

      - name: Run illustrative examples
        run: |
          python examples/illustrative_spectra96.py
          python examples/forward_to_inverse.py

      - name: Verify non-editable wheel install
        if: matrix.python-version == '3.11'
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install .
          /tmp/wheel-venv/bin/python -c "import biolaser_twin; print(biolaser_twin.__version__)"
          /tmp/wheel-venv/bin/python examples/illustrative_spectra96.py
